<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="color-scheme" content="light">
<title>수학 모둠 토론 교실</title>
<style>
:root{--cream:#fffaf0;--paper:#fffdf8;--ink:#3e3440;--muted:#756e78;--coral:#ef8f79;--coral-dark:#bd604e;--peach:#ffe1d3;--mint:#d7eee1;--lilac:#e9ddf7;--line:#eaded2;--shadow:0 12px 32px #69544b16}*{box-sizing:border-box}body{margin:0;background:var(--cream);color:var(--ink);font-family:'Apple SD Gothic Neo','Malgun Gothic','Nanum Gothic',system-ui,sans-serif;line-height:1.55}button,input,textarea,select{font:inherit}button{cursor:pointer}button:disabled{cursor:not-allowed;opacity:.5}h1,h2,h3,p{margin-top:0}h1,h2,h3,.brand,.pill,.button{letter-spacing:-.035em}h1{font-size:clamp(2rem,5vw,3.6rem);line-height:1.18}h2{font-size:1.65rem}h3{font-size:1.15rem}.shell{max-width:1160px;margin:auto;padding:22px 22px 60px}.topbar{display:flex;align-items:center;justify-content:space-between;gap:15px;margin-bottom:30px}.brand{display:flex;align-items:center;gap:10px;font-weight:900;font-size:1.28rem}.brand-mark{width:42px;height:42px;display:grid;place-items:center;background:var(--coral);color:white;border-radius:14px;transform:rotate(-7deg);font-size:1.4rem}.top-actions{display:flex;gap:8px;flex-wrap:wrap}.button{border:1px solid transparent;background:var(--coral);color:#fff;padding:11px 17px;border-radius:13px;font-weight:800;box-shadow:0 3px 0 #c86755;transition:transform .15s,background .15s}.button:hover:not(:disabled){transform:translateY(-2px);background:#e67c68}.button:active:not(:disabled){transform:translateY(2px);box-shadow:none}.button.secondary{background:white;border-color:var(--line);color:var(--ink);box-shadow:0 3px 0 #e9dbcf}.button.secondary:hover:not(:disabled){background:#fff4e9}.button.mint{background:#65af8e;box-shadow:0 3px 0 #43866a}.button.danger{background:#fff1ed;color:#aa4d43;border-color:#f5c9bd;box-shadow:none}.button.small{padding:7px 11px;border-radius:10px;font-size:.88rem;box-shadow:none}.button.link{background:none;color:var(--coral-dark);padding:4px;box-shadow:none}.card{background:var(--paper);border:1px solid var(--line);border-radius:24px;padding:24px;box-shadow:var(--shadow)}.hero{display:grid;grid-template-columns:1.3fr .7fr;gap:30px;align-items:center;padding:40px;background:#fff1e4;border-radius:30px;margin-bottom:25px}.hero p{font-size:1.1rem;color:#705f5c}.hero-art{min-height:225px;border-radius:28px;background:linear-gradient(145deg,#f9bfad 0 40%,#e5d5f5 40% 71%,#d4ebd8 71%);display:flex;align-items:center;justify-content:center}.hero-art span{width:64%;height:48%;background:#fffaf1;border-radius:18px;box-shadow:12px 14px 0 #e6a496;transform:rotate(-6deg);display:grid;place-items:center;color:#b56563;font-size:2rem;font-weight:900}.grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:18px}.stack{display:grid;gap:18px}.row{display:flex;align-items:center;gap:10px;flex-wrap:wrap}.between{justify-content:space-between}.muted{color:var(--muted)}.smalltext{font-size:.88rem}.eyebrow{font-weight:900;color:var(--coral-dark);font-size:.78rem;letter-spacing:.08em;text-transform:uppercase}.label{display:block;font-weight:800;margin:0 0 7px}.field{width:100%;border:1.5px solid #d9cbbf;background:white;color:var(--ink);border-radius:12px;padding:12px 14px;outline:none}.field:focus{border-color:var(--coral);box-shadow:0 0 0 3px #ef8f7930}textarea.field{min-height:130px;resize:vertical}.field.long{min-height:210px}.form-item{margin-bottom:15px}.notice{background:#fff0dc;border-radius:14px;padding:12px 14px;color:#785b3d}.notice.mint{background:#e7f4e8;color:#3c745a}.notice.lilac{background:#f2eafb;color:#65517d}.pill{display:inline-block;border-radius:99px;padding:5px 11px;background:var(--peach);font-weight:800;font-size:.85rem;color:#995447}.pill.mint{background:var(--mint);color:#39785c}.pill.lilac{background:var(--lilac);color:#6f518a}.divider{height:1px;background:var(--line);margin:20px 0}.topic-list{display:grid;gap:10px}.topic-option{border:1.5px solid var(--line);border-radius:16px;background:white;padding:15px;text-align:left;width:100%;font-weight:800;color:var(--ink)}.topic-option:hover,.topic-option.selected{border-color:var(--coral);background:#fff2eb}.topic-option.selected:before{content:'✓ ';color:var(--coral-dark)}.stagebar{display:flex;gap:8px;align-items:center;flex-wrap:wrap;margin-bottom:18px}.stagebar .step{border-radius:99px;background:#eee5e1;color:#85777a;padding:8px 13px;font-size:.9rem;font-weight:800}.stagebar .step.active{background:var(--coral);color:white}.tabs{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:18px}.tabs button{border:1px solid var(--line);background:white;border-radius:12px;padding:9px 13px;font-weight:800;color:var(--muted)}.tabs button.active{background:var(--ink);color:white}.opinion{border:1px solid var(--line);border-radius:16px;background:white;padding:17px;margin-top:12px}.opinion p,.prewrap{white-space:pre-wrap;overflow-wrap:anywhere}.opinion .head{display:flex;gap:10px;align-items:center;justify-content:space-between;flex-wrap:wrap}.sketch-wrap{border:2px dashed #d7b8aa;border-radius:16px;background:white;overflow:hidden;touch-action:none}.sketch{display:block;width:100%;height:220px;touch-action:none;cursor:crosshair}.swatch{width:28px;height:28px;border-radius:50%;border:2px solid white;box-shadow:0 0 0 1px #b9a9a1;padding:0}.swatch.selected{box-shadow:0 0 0 3px #6e6362}.session-card{border:1px solid var(--line);border-radius:18px;background:white;padding:18px}.session-card.selected{border-color:var(--coral);background:#fff8f2}.stat{background:#f5eee7;border-radius:14px;padding:10px 14px;min-width:120px}.stat strong{display:block;font-size:1.25rem}.record{border:1px solid var(--line);border-radius:18px;padding:18px;background:white;margin-top:12px}.history{font-size:.87rem;background:#f8f3ef;padding:10px;border-radius:10px;margin-top:8px}.history summary{cursor:pointer;font-weight:800}.check{display:flex;align-items:flex-start;gap:9px;font-size:.92rem}.check input{width:18px;height:18px;accent-color:var(--coral);margin-top:3px}.presentation{background:#2d2b36;min-height:70vh;padding:32px;border-radius:24px;color:white}.presentation .slide{position:relative;background:#fffdf6;color:var(--ink);padding:40px;border-radius:22px;min-height:400px;margin-top:18px}.presentation .slide h2{font-size:clamp(1.8rem,4vw,3.2rem)}.presentation .slide p{font-size:clamp(1.15rem,2.5vw,1.7rem);line-height:1.9}.highlight{position:absolute;inset:0;width:100%;height:100%;touch-action:none;cursor:crosshair}.print-only{display:none}.empty{text-align:center;padding:35px 20px;color:var(--muted);background:#fff8f1;border-radius:18px}.footer{text-align:center;color:#9b8d87;margin-top:30px;font-size:.82rem}#toast{position:fixed;bottom:22px;left:50%;transform:translateX(-50%);background:#3e3440;color:white;padding:10px 18px;border-radius:12px;box-shadow:var(--shadow);z-index:20;display:none}@media(max-width:720px){.hero,.grid{grid-template-columns:1fr}.hero{padding:25px}.hero-art{min-height:130px}.shell{padding:14px 14px 40px}.card{padding:18px}.topbar{align-items:flex-start}.brand{font-size:1.05rem}.presentation{padding:14px}.presentation .slide{padding:24px}}@media print{body{background:white;color:black}.shell,#toast{display:none!important}.print-only{display:block!important;padding:0 12mm;font:11pt/1.5 sans-serif;color:black}.print-only h1{font-size:20pt}.print-only h2{font-size:15pt;margin-top:22px}.print-only h3{font-size:12pt;margin-top:16px}.print-record{break-inside:avoid;border-top:1px solid #888;padding-top:8px}.print-only img{max-width:100%;max-height:110px;border:1px solid #bbb}.print-only .prewrap{white-space:pre-wrap}}
</style>
</head>
<body>
<div id="app" class="shell"></div><div id="print" class="print-only"></div><div id="toast" role="status"></div>
<script>
(()=>{'use strict';
const KEY='math-discussion-classroom-single-v1';
const $=id=>document.getElementById(id);
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const uid=()=>globalThis.crypto?.randomUUID?.()||Date.now().toString(36)+Math.random().toString(36).slice(2);
const stamp=t=>t?new Date(t).toLocaleString('ko-KR',{dateStyle:'medium',timeStyle:'short'}):'—';
const duration=ms=>{const s=Math.max(0,Math.floor(ms/1000));return `${Math.floor(s/3600)}시간 ${String(Math.floor(s/60)%60).padStart(2,'0')}분 ${String(s%60).padStart(2,'0')}초`};
let db;try{db=JSON.parse(localStorage.getItem(KEY))||{sessions:[]}}catch{db={sessions:[]}}if(!Array.isArray(db.sessions))db.sessions=[];
let ui={view:'home',teacher:false,sessionId:null,studentKey:null,topicId:null,tab:'discussion',teacherTab:'overview',presentKey:null,paint:'pen',color:'#7c5c86',highlightColor:'#ffe35c'};
function save(){try{localStorage.setItem(KEY,JSON.stringify(db))}catch(e){toast('저장 공간이 부족합니다. 브레인스토밍 그림 크기를 줄여 주세요.')}}
function toast(message){const el=$('toast');el.textContent=message;el.style.display='block';clearTimeout(toast.timer);toast.timer=setTimeout(()=>el.style.display='none',2600)}
const session=()=>db.sessions.find(s=>s.id===ui.sessionId);
const student=()=>session()?.students?.[ui.studentKey];
const activeTime=r=>Math.max(0,Date.now()-r.joinedAt-(r.awayMs||0)-(r.awayAt?Date.now()-r.awayAt:0));
function header(){return `<header class="topbar"><div class="brand"><span class="brand-mark">∑</span> 수학 모둠 토론 교실</div><div class="top-actions">${ui.view!=='home'?'<button class="button secondary small" data-action="home">처음으로</button>':''}${ui.teacher&&ui.view!=='teacher'?'<button class="button secondary small" data-action="teacher-home">교사 화면</button>':''}</div></header>`}
function home(){return `<section class="hero"><div><span class="eyebrow">함께 생각하고 더 깊이 배우는 시간</span><h1>나의 생각이 모여<br>우리의 배움이 돼요.</h1><p>수학 주제를 골라 친구들과 의견을 나누고, 생각을 다듬어 최종 의견을 완성해 보세요.</p><div class="row"><button class="button" data-action="student-entry">학생으로 입장</button><button class="button secondary" data-action="teacher-entry">교사로 입장</button></div></div><div class="hero-art" aria-hidden="true"><span>생각 + 생각</span></div></section><div class="grid"><div class="card"><span class="pill">1단계</span><h3>친구들과 토론</h3><p class="muted">브레인스토밍하고 내 의견을 저장해 같은 주제를 고른 친구들의 의견을 읽어요.</p></div><div class="card"><span class="pill mint">2단계</span><h3>최종 의견 정리</h3><p class="muted">교사가 제출을 열면 토론을 계속하면서 나의 최종 의견을 제출할 수 있어요.</p></div></div><p class="footer">단일 파일 버전 · 이 브라우저에 저장된 내용만 보입니다.</p>`}
function entry(){const opts=db.sessions.map(s=>`<option value="${esc(s.id)}">${esc(s.title)}</option>`).join('');return `<div class="grid"><section class="card"><span class="eyebrow">STUDENT</span><h2>학생 입장</h2>${!db.sessions.length?'<div class="notice">아직 개설된 수업이 없습니다. 교사가 먼저 수업을 만들어 주세요.</div>':`<form id="student-form"><div class="form-item"><label class="label" for="class-select">참여할 수업</label><select class="field" id="class-select" required>${opts}</select></div><div class="form-item"><label class="label" for="student-number">학번</label><input class="field" id="student-number" required maxlength="24" autocomplete="off" placeholder="예: 20301"></div><div class="form-item"><label class="label" for="student-name">이름</label><input class="field" id="student-name" required maxlength="30" autocomplete="off" placeholder="이름을 입력해 주세요"></div><label class="check form-item"><input type="checkbox" id="consent"> <span>개인정보 수집 및 이용에 동의합니다.</span></label><button class="button" id="enter-student" disabled>토론방 선택하기</button></form>`}</section><div class="card"><h3>수업 안내</h3><p class="muted">수업을 선택하고 학번과 이름을 입력한 뒤 주제를 하나 고르세요.</p><div class="notice">이 파일의 기록은 현재 브라우저에만 저장됩니다. 다른 기기의 학생과 공유하려면 서버가 연결된 웹앱을 이용해야 합니다.</div></div></div>`}
function teacherLogin(){return `<div class="card" style="max-width:480px;margin:35px auto"><span class="eyebrow">TEACHER</span><h2>교사 입장</h2><form id="teacher-login"><label class="label" for="password">비밀번호</label><input class="field" type="password" id="password" required autocomplete="current-password" placeholder="비밀번호 입력"><p></p><button class="button">입장하기</button></form><p class="smalltext muted" style="margin-top:20px">단일 파일의 비밀번호는 파일 내부에서 확인할 수 있습니다. 실제 학생 개인정보를 보호하는 인증 수단으로 사용하지 마세요.</p></div>`}
function chooseTopic(){const s=session(),r=student();if(!s||!r)return entry();return `<div class="card"><span class="eyebrow">${esc(s.title)}</span><h2>${esc(r.name)}님, 토론 주제를 골라 주세요</h2><p class="muted">하나를 선택하면 같은 주제를 고른 친구들의 의견을 볼 수 있어요.</p><div class="topic-list">${s.topics.map(t=>`<button class="topic-option ${ui.topicId===t.id?'selected':''}" data-action="select-topic" data-id="${esc(t.id)}">${esc(t.title)}</button>`).join('')}</div><p></p><button class="button" data-action="join-topic" ${!ui.topicId?'disabled':''}>토론방 입장</button></div>`}
function studentRoom(){const s=session(),r=student();if(!s||!r||!r.topicId)return chooseTopic();const t=s.topics.find(t=>t.id===r.topicId),peers=Object.values(s.students).filter(x=>x.topicId===r.topicId&&x.opinion).sort((a,b)=>b.updatedAt-a.updatedAt);return `<div class="row between"><div><span class="eyebrow">${esc(s.title)}</span><h2 style="margin-bottom:5px">${esc(t?.title||'토론방')}</h2><span class="muted">${esc(r.number)} ${esc(r.name)}</span></div><span class="pill ${s.stage===2?'mint':''}">${s.stage===2?'2단계 · 최종 의견 제출 가능':'1단계 · 토론 중'}</span></div><div class="stagebar"><span class="step active">1 친구들과 토론</span><span class="step ${s.stage===2?'active':''}">2 나의 최종 의견 정리</span></div><div class="row" style="margin-bottom:20px"><div class="stat">시작 시각<strong class="smalltext">${stamp(r.joinedAt)}</strong></div><div class="stat">학습 시간<strong id="study-time">${duration(activeTime(r))}</strong></div><div class="stat">이탈 횟수<strong>${r.awayCount||0}회</strong></div><div class="stat">이탈 시간<strong id="away-time">${duration((r.awayMs||0)+(r.awayAt?Date.now()-r.awayAt:0))}</strong></div></div><div class="tabs"><button data-action="student-tab" data-tab="discussion" class="${ui.tab==='discussion'?'active':''}">의견 나누기</button><button data-action="student-tab" data-tab="final" class="${ui.tab==='final'?'active':''}">최종 의견</button></div>${ui.tab==='final'?finalView(s,r):discussionView(s,r,peers)}`}
function discussionView(s,r,peers){return `<div class="grid"><div class="stack"><section class="card"><span class="eyebrow">OPTIONAL</span><h3>펜으로 브레인스토밍</h3><p class="smalltext muted">떠오르는 생각을 자유롭게 그려 보세요. 그림은 이 브라우저에 저장됩니다.</p><div class="row" style="margin-bottom:10px"><button class="button small ${ui.paint==='pen'?'':'secondary'}" data-action="paint-mode" data-mode="pen">✎ 펜</button><button class="button small ${ui.paint==='eraser'?'':'secondary'}" data-action="paint-mode" data-mode="eraser">▣ 지우개</button><button class="button secondary small" data-action="clear-sketch">전체 지우기</button><button class="swatch ${ui.color==='#7c5c86'?'selected':''}" style="background:#7c5c86" data-action="paint-color" data-color="#7c5c86" aria-label="보라색"></button><button class="swatch ${ui.color==='#e27b68'?'selected':''}" style="background:#e27b68" data-action="paint-color" data-color="#e27b68" aria-label="산호색"></button><button class="swatch ${ui.color==='#4b9271'?'selected':''}" style="background:#4b9271" data-action="paint-color" data-color="#4b9271" aria-label="초록색"></button></div><div class="sketch-wrap"><canvas id="sketch" class="sketch" width="800" height="360" aria-label="브레인스토밍 그리기"></canvas></div><button class="button secondary small" data-action="save-sketch" style="margin-top:10px">그림 저장</button></section><section class="card"><span class="eyebrow">MY IDEA</span><h3>나의 의견</h3><p class="smalltext muted">길게 적어도 괜찮아요. 다시 저장하면 친구에게 보이는 글은 최신 글로 바뀝니다.</p><textarea id="opinion-input" class="field long" placeholder="내 생각과 그 이유를 자유롭게 적어 보세요.">${esc(r.opinion||'')}</textarea><div class="row between" style="margin-top:10px"><button class="button" data-action="save-opinion">의견 저장·업데이트</button><span class="smalltext muted">${r.updatedAt?'최근 저장 '+stamp(r.updatedAt):'아직 저장하지 않았어요'}</span></div></section></div><section class="card"><span class="eyebrow">TOGETHER</span><h3>같은 주제 친구들의 생각 <span class="pill mint">${peers.length}명</span></h3><p class="smalltext muted">같은 브라우저에 저장된 글이 표시됩니다. 다른 창의 변경 사항은 새로고침하면 반영됩니다.</p>${peers.length?peers.map(x=>`<article class="opinion"><div class="head"><strong>${esc(x.name)} <span class="smalltext muted">${esc(x.number)}</span></strong><span class="smalltext muted">${stamp(x.updatedAt)}</span></div><p>${esc(x.opinion)}</p></article>`).join(''):'<div class="empty">아직 올라온 의견이 없어요.<br>첫 생각을 남겨 보세요!</div>'}</section></div>`}
function finalView(s,r){return `<div class="grid"><section class="card"><span class="eyebrow">FINAL IDEA</span><h3>나의 최종 의견 정리</h3>${s.stage<2?'<div class="notice">토론은 계속할 수 있어요. 교사가 2단계를 열면 최종 의견을 제출할 수 있습니다.</div>':`<p class="muted">친구들과의 토론에서 얻은 생각을 보완해 적어 주세요. 토론 글은 계속 수정하고 공유할 수 있어요.</p><textarea id="final-input" class="field long" placeholder="토론 뒤 달라진 생각과 그 이유를 적어 보세요.">${esc(r.finalOpinion||'')}</textarea><label class="check" style="margin:14px 0"><input type="checkbox" id="volunteer" ${r.volunteer?'checked':''}><span>내 최종 의견으로 발표하기를 희망합니다.</span></label><button class="button mint" data-action="submit-final">최종 의견 제출${r.finalAt?'·수정':''}</button>${r.finalAt?`<p class="smalltext muted" style="margin-top:12px">제출 시각: ${stamp(r.finalAt)}</p>`:''}`}</section><section class="card"><h3>토론을 돌아보며</h3><div class="notice lilac">1단계 의견은 2단계에서도 언제든지 다시 저장하고 친구들과 공유할 수 있습니다.</div><p class="muted" style="margin-top:18px">처음에는 어떻게 생각했나요? 친구의 의견 중 새로웠던 점은 무엇인가요? 어떤 이유로 생각을 다듬었나요?</p><button class="button secondary" data-action="student-tab" data-tab="discussion">토론방으로 돌아가기</button></section></div>`}
function teacherHome(){const s=session();return `<div class="row between"><div><span class="eyebrow">TEACHER DESK</span><h2>수업 관리</h2></div><button class="button secondary small" data-action="logout">교사 나가기</button></div><div class="grid" style="grid-template-columns:minmax(250px,.8fr) minmax(0,1.2fr)"><div class="stack"><section class="card"><h3>새 수업 만들기</h3><form id="class-form"><div class="form-item"><label class="label" for="class-title">수업 이름</label><input class="field" id="class-title" maxlength="70" required placeholder="예: 2학년 수학 3반"></div><div class="form-item"><label class="label" for="class-topics">토론 주제 3~4개</label><textarea class="field" id="class-topics" required placeholder="한 줄에 한 주제씩 입력하세요.&#10;예: 피타고라스 정리를 어떻게 설명할까?" style="min-height:130px"></textarea></div><button class="button">수업 만들기</button></form></section><section class="card"><h3>수업 목록</h3>${db.sessions.length?db.sessions.map(x=>`<div class="session-card ${x.id===ui.sessionId?'selected':''}"><div class="row between"><strong>${esc(x.title)}</strong><span class="pill ${x.stage===2?'mint':''}">${x.stage}단계</span></div><p class="smalltext muted" style="margin:6px 0">${stamp(x.createdAt)} · ${Object.keys(x.students||{}).length}명</p><div class="row"><button class="button secondary small" data-action="open-class" data-id="${esc(x.id)}">관리하기</button><button class="button danger small" data-action="delete-class" data-id="${esc(x.id)}">수업 삭제</button></div></div>`).join(''):'<p class="muted">수업을 만들어 시작해 보세요.</p>'}</section></div><div>${s?teacherSession(s):'<div class="card empty">왼쪽에서 수업을 선택하면 토론 과정과 학생 기록을 볼 수 있어요.</div>'}</div></div>`}
function teacherSession(s){const records=Object.values(s.students||{}).sort((a,b)=>a.joinedAt-b.joinedAt);const grouped=s.topics.map(t=>({t,list:records.filter(r=>r.topicId===t.id)}));return `<div class="card"><div class="row between"><div><span class="eyebrow">${esc(s.title)}</span><h2 style="margin-bottom:0">수업 현황</h2></div><span class="pill ${s.stage===2?'mint':''}">${s.stage===2?'2단계 열림':'1단계 토론 중'}</span></div><p class="muted smalltext">개설: ${stamp(s.createdAt)} · 참여 ${records.length}명 · 최종 제출 ${records.filter(r=>r.finalAt).length}명</p><div class="row"><button class="button mint" data-action="advance-stage" ${s.stage===2?'disabled':''}>${s.stage===2?'2단계 진행 중':'2단계 최종 의견 제출 열기'}</button><button class="button secondary" data-action="print-class">전 과정 PDF 저장</button></div><p class="smalltext muted" style="margin:12px 0 0">2단계를 열어도 의견 저장과 공유는 계속됩니다. PDF 버튼은 인쇄 창을 열며 ‘PDF로 저장’을 선택할 수 있습니다.</p><div class="divider"></div><div class="tabs"><button data-action="teacher-tab" data-tab="overview" class="${ui.teacherTab==='overview'?'active':''}">주제별 토론</button><button data-action="teacher-tab" data-tab="records" class="${ui.teacherTab==='records'?'active':''}">학생 기록</button><button data-action="teacher-tab" data-tab="present" class="${ui.teacherTab==='present'?'active':''}">발표 선택</button></div>${ui.teacherTab==='records'?teacherRecords(records,s):ui.teacherTab==='present'?teacherPresent(records,s):grouped.map(({t,list})=>`<section style="margin:20px 0"><h3><span class="pill lilac">주제</span> ${esc(t.title)} <span class="smalltext muted">${list.length}명</span></h3>${list.length?list.map(r=>`<article class="opinion"><div class="head"><strong>${esc(r.name)} (${esc(r.number)})</strong><span class="smalltext muted">${r.updatedAt?stamp(r.updatedAt):'작성 전'}</span></div><p>${r.opinion?esc(r.opinion):'<span class="muted">아직 의견이 없습니다.</span>'}</p></article>`).join(''):'<div class="empty">이 주제에 참여한 학생이 없습니다.</div>'}</section>`).join('')}</div>`}
function teacherRecords(records,s){return records.length?records.map(r=>`<article class="record"><div class="row between"><div><strong>${esc(r.number)} ${esc(r.name)}</strong> <span class="pill lilac">${esc(s.topics.find(t=>t.id===r.topicId)?.title||'주제 선택 전')}</span></div><button class="button danger small" data-action="delete-student" data-key="${esc(r.key)}">학생 기록 삭제</button></div><p class="smalltext muted">입장 ${stamp(r.joinedAt)} · 학습 ${duration(activeTime(r))} · 이탈 ${r.awayCount||0}회 / ${duration((r.awayMs||0)+(r.awayAt?Date.now()-r.awayAt:0))}</p><h3>1단계 의견</h3><div class="prewrap">${r.opinion?esc(r.opinion):'<span class="muted">작성 전</span>'}</div>${r.brainstorm?`<h3 style="margin-top:12px">브레인스토밍</h3><img src="${r.brainstorm}" alt="${esc(r.name)}의 브레인스토밍" style="width:100%;max-height:130px;object-fit:contain;border:1px solid var(--line);border-radius:10px">`:''}<details class="history"><summary>의견 수정 과정 ${r.history?.length||0}회</summary>${(r.history||[]).map((h,i)=>`<p><strong>${i+1}. ${stamp(h.at)}</strong><br><span class="prewrap">${esc(h.text)}</span></p>`).join('')||'수정 기록이 없습니다.'}</details><h3 style="margin-top:15px">2단계 최종 의견 ${r.volunteer?'<span class="pill mint">발표 희망</span>':''}</h3><div class="prewrap">${r.finalOpinion?esc(r.finalOpinion):'<span class="muted">제출 전</span>'}</div><p class="smalltext muted">${r.finalAt?'제출 '+stamp(r.finalAt):''}</p></article>`).join(''):'<div class="empty">아직 참여한 학생이 없습니다.</div>'}
function teacherPresent(records,s){const candidates=records.filter(r=>r.finalOpinion&&r.volunteer);return `${candidates.length?candidates.map(r=>`<article class="opinion"><div class="row between"><div><strong>${esc(r.name)} (${esc(r.number)})</strong><p class="smalltext muted" style="margin:0">${esc(s.topics.find(t=>t.id===r.topicId)?.title||'')}</p></div><button class="button small" data-action="present" data-key="${esc(r.key)}">발표 화면</button></div></article>`).join(''):'<div class="empty">발표를 희망한 최종 의견이 아직 없습니다.</div>'}`}
function presentation(){const s=session(),r=s?.students?.[ui.presentKey];if(!s||!r){ui.view='teacher';return teacherHome()}const topic=s.topics.find(t=>t.id===r.topicId);return `<div class="presentation"><div class="row between"><div><span class="eyebrow" style="color:#ffc7b6">발표 시간</span><h2 style="margin:0">${esc(s.title)}</h2></div><button class="button secondary" data-action="back-teacher">발표 종료</button></div><div class="row" style="margin-top:15px"><button class="button small" data-action="highlight-color" data-color="#ffe35c">🖍 노란 형광펜</button><button class="button small secondary" data-action="highlight-color" data-color="#a3edc0">초록 형광펜</button><button class="button small secondary" data-action="clear-highlight">표시 지우기</button><span class="smalltext">화면 위에 밑줄을 그어 강조할 수 있어요.</span></div><div class="slide" id="slide"><span class="pill lilac">토론 주제 · ${esc(topic?.title||'')}</span><h2>${esc(r.name)} 학생의 최종 의견</h2><p class="prewrap">${esc(r.finalOpinion)}</p><canvas id="highlight" class="highlight" aria-label="발표 형광펜"></canvas></div></div>`}
function render(){const content=ui.view==='entry'?entry():ui.view==='teacher-login'?teacherLogin():ui.view==='topic'?chooseTopic():ui.view==='room'?studentRoom():ui.view==='teacher'?teacherHome():ui.view==='presentation'?presentation():home();$('app').innerHTML=header()+content;if(ui.view==='room'&&ui.tab==='discussion')initSketch();if(ui.view==='presentation')initHighlight()}
function initSketch(){const canvas=$('sketch'),r=student();if(!canvas||!r)return;const ctx=canvas.getContext('2d');if(r.brainstorm){const img=new Image();img.onload=()=>ctx.drawImage(img,0,0,canvas.width,canvas.height);img.src=r.brainstorm}wireDrawing(canvas,ctx,()=>ui.paint==='eraser'?'#000':ui.color,()=>ui.paint==='eraser'?28:3,()=>ui.paint==='eraser'?'destination-out':'source-over')}
function initHighlight(){const canvas=$('highlight'),slide=$('slide');if(!canvas||!slide)return;canvas.width=slide.clientWidth;canvas.height=slide.clientHeight;wireDrawing(canvas,canvas.getContext('2d'),()=>ui.highlightColor,()=>17,()=> 'multiply')}
function wireDrawing(canvas,ctx,color,width,composite){let drawing=false;const pos=e=>{const box=canvas.getBoundingClientRect();return{x:(e.clientX-box.left)*canvas.width/box.width,y:(e.clientY-box.top)*canvas.height/box.height}};canvas.addEventListener('pointerdown',e=>{e.preventDefault();canvas.setPointerCapture(e.pointerId);drawing=true;const p=pos(e);ctx.beginPath();ctx.moveTo(p.x,p.y);ctx.lineTo(p.x+.01,p.y+.01);ctx.globalCompositeOperation=composite();ctx.strokeStyle=color();ctx.lineWidth=width();ctx.lineCap='round';ctx.lineJoin='round';ctx.stroke()});canvas.addEventListener('pointermove',e=>{if(!drawing)return;e.preventDefault();const p=pos(e);ctx.lineTo(p.x,p.y);ctx.globalCompositeOperation=composite();ctx.strokeStyle=color();ctx.lineWidth=width();ctx.stroke()});const end=()=>{drawing=false;ctx.beginPath();ctx.globalCompositeOperation='source-over'};canvas.addEventListener('pointerup',end);canvas.addEventListener('pointercancel',end)}
function printSession(){const s=session();if(!s)return;const records=Object.values(s.students||{}).sort((a,b)=>a.joinedAt-b.joinedAt);$('print').innerHTML=`<h1>수학 모둠 토론 교실 · ${esc(s.title)}</h1><p>개설 ${stamp(s.createdAt)} · 단계 ${s.stage} · 학생 ${records.length}명 · 출력 ${stamp(Date.now())}</p><h2>토론 주제</h2><ol>${s.topics.map(t=>`<li>${esc(t.title)}</li>`).join('')}</ol>${records.map(r=>`<section class="print-record"><h2>${esc(r.number)} ${esc(r.name)}</h2><p>주제: ${esc(s.topics.find(t=>t.id===r.topicId)?.title||'선택 전')}<br>입장: ${stamp(r.joinedAt)} · 학습: ${duration(activeTime(r))} · 이탈: ${r.awayCount||0}회 / ${duration((r.awayMs||0)+(r.awayAt?Date.now()-r.awayAt:0))}</p>${r.brainstorm?`<h3>브레인스토밍</h3><img src="${r.brainstorm}" alt="브레인스토밍">`:''}<h3>1단계 토론 의견과 수정 과정</h3>${(r.history||[]).map((h,i)=>`<p><b>${i+1}. ${stamp(h.at)}</b><br><span class="prewrap">${esc(h.text)}</span></p>`).join('')||'<p>작성 전</p>'}<h3>2단계 최종 의견</h3><p class="prewrap">${esc(r.finalOpinion||'제출 전')}</p><p>제출: ${stamp(r.finalAt)} · 발표 희망: ${r.volunteer?'예':'아니요'}</p></section>`).join('')}`;window.print()}
function markAway(away){if(ui.view!=='room')return;const r=student();if(!r)return;if(away&&!r.awayAt){r.awayAt=Date.now();r.awayCount=(r.awayCount||0)+1;save()}if(!away&&r.awayAt){r.awayMs=(r.awayMs||0)+Date.now()-r.awayAt;r.awayAt=null;save();render()}}
document.addEventListener('visibilitychange',()=>markAway(document.hidden));window.addEventListener('blur',()=>markAway(true));window.addEventListener('focus',()=>markAway(false));window.addEventListener('storage',e=>{if(e.key===KEY){try{db=JSON.parse(e.newValue)||{sessions:[]};if(ui.view!=='room'||ui.tab!=='discussion'||!$('opinion-input')?.matches(':focus'))render()}catch{}}});setInterval(()=>{const r=student();if(ui.view==='room'&&r){if($('study-time'))$('study-time').textContent=duration(activeTime(r));if($('away-time'))$('away-time').textContent=duration((r.awayMs||0)+(r.awayAt?Date.now()-r.awayAt:0))}},1000);
document.addEventListener('change',e=>{if(e.target.id==='consent')$('enter-student').disabled=!e.target.checked});
document.addEventListener('submit',e=>{e.preventDefault();if(e.target.id==='teacher-login'){if($('password').value==='mathchan'){ui.teacher=true;ui.view='teacher';ui.sessionId=db.sessions[0]?.id||null;render()}else{toast('비밀번호를 확인해 주세요');$('password').value=''}return}if(e.target.id==='class-form'){const title=$('class-title').value.trim(),topics=$('class-topics').value.split('\n').map(x=>x.trim()).filter(Boolean);if(topics.length<3||topics.length>4){toast('주제를 3개 또는 4개 입력해 주세요');return}const s={id:uid(),title,topics:topics.map(title=>({id:uid(),title})),stage:1,createdAt:Date.now(),students:{}};db.sessions.unshift(s);ui.sessionId=s.id;save();render();toast('수업을 만들었어요');return}if(e.target.id==='student-form'){if(!$('consent').checked)return;const s=db.sessions.find(x=>x.id===$('class-select').value),number=$('student-number').value.trim(),name=$('student-name').value.trim();if(!s||!number||!name)return;const key=number+'|'+name;let r=s.students[key];if(!r){r={key,number,name,topicId:null,joinedAt:Date.now(),awayCount:0,awayMs:0,awayAt:null,brainstorm:'',opinion:'',history:[],updatedAt:null,finalOpinion:'',finalAt:null,volunteer:false};s.students[key]=r;save()}ui.sessionId=s.id;ui.studentKey=key;ui.topicId=r.topicId;ui.tab='discussion';ui.view=r.topicId?'room':'topic';render()}});
document.addEventListener('click',e=>{const b=e.target.closest('[data-action]');if(!b)return;const action=b.dataset.action,id=b.dataset.id,key=b.dataset.key,s=session(),r=student();switch(action){case 'home':markAway(false);ui.view='home';ui.studentKey=null;break;case 'student-entry':ui.view='entry';break;case 'teacher-entry':ui.view=ui.teacher?'teacher':'teacher-login';break;case 'teacher-home':ui.view='teacher';break;case 'logout':ui.teacher=false;ui.view='home';ui.sessionId=null;break;case 'open-class':ui.sessionId=id;ui.teacherTab='overview';break;case 'delete-class':{const x=db.sessions.find(x=>x.id===id);if(!x||!confirm(`「${x.title}」 수업과 모든 학생 기록을 삭제할까요? 복구할 수 없습니다.`))return;db.sessions=db.sessions.filter(x=>x.id!==id);ui.sessionId=db.sessions[0]?.id||null;save();toast('수업을 삭제했어요');break}case 'select-topic':ui.topicId=id;break;case 'join-topic':if(s&&r&&s.topics.some(t=>t.id===ui.topicId)){r.topicId=ui.topicId;save();ui.view='room'}break;case 'student-tab':ui.tab=b.dataset.tab;break;case 'teacher-tab':ui.teacherTab=b.dataset.tab;break;case 'save-opinion':{const val=$('opinion-input')?.value.trim();if(!r||!val){toast('의견을 입력해 주세요');return}if(val!==r.opinion){r.opinion=val;r.updatedAt=Date.now();r.history=(r.history||[]).concat({at:r.updatedAt,text:val});save();render();toast('최신 의견으로 공유했어요')}else toast('이미 저장된 의견입니다');return}case 'save-sketch':if(r&&$('sketch')){r.brainstorm=$('sketch').toDataURL('image/png');save();toast('브레인스토밍을 저장했어요')}return;case 'clear-sketch':if(confirm('브레인스토밍 그림을 모두 지울까요?')){const c=$('sketch');c.getContext('2d').clearRect(0,0,c.width,c.height);if(r){r.brainstorm='';save()}toast('그림을 지웠어요')}return;case 'paint-mode':ui.paint=b.dataset.mode;document.querySelectorAll('[data-action=paint-mode]').forEach(x=>{x.classList.toggle('secondary',x.dataset.mode!==ui.paint)});return;case 'paint-color':ui.color=b.dataset.color;ui.paint='pen';document.querySelectorAll('[data-action=paint-color]').forEach(x=>x.classList.toggle('selected',x.dataset.color===ui.color));document.querySelectorAll('[data-action=paint-mode]').forEach(x=>x.classList.toggle('secondary',x.dataset.mode!==ui.paint));return;case 'submit-final':{if(!s||!r||s.stage!==2)return;const val=$('final-input')?.value.trim();if(!val){toast('최종 의견을 입력해 주세요');return}r.finalOpinion=val;r.finalAt=Date.now();r.volunteer=$('volunteer').checked;save();render();toast('최종 의견을 제출했어요');return}case 'advance-stage':if(s&&s.stage===1&&confirm('2단계 최종 의견 제출을 열까요? 토론 글 저장과 공유는 계속 가능합니다.')){s.stage=2;save();toast('2단계를 열었어요')}break;case 'delete-student':if(s&&s.students[key]&&confirm(`${s.students[key].name} 학생의 전체 기록을 삭제할까요? 복구할 수 없습니다.`)){delete s.students[key];save();toast('학생 기록을 삭제했어요')}break;case 'print-class':printSession();return;case 'present':ui.presentKey=key;ui.view='presentation';break;case 'back-teacher':ui.view='teacher';ui.teacherTab='present';break;case 'highlight-color':ui.highlightColor=b.dataset.color;return;case 'clear-highlight':{const c=$('highlight');if(c)c.getContext('2d').clearRect(0,0,c.width,c.height);return}default:return}render()});
render();
})();
</script>
</body>
</html>
